<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配置 - 基金实时估值</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .header h1 {
            color: #333;
            font-size: 24px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 10px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .config-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
        }
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
        .save-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .save-btn:hover {
            transform: translateY(-2px);
        }
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .message.error {
            background: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ 系统配置</h1>
            <a href="/" class="back-btn">← 返回首页</a>
        </div>
        <div class="config-card">
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="enable_auth">
                    <label for="enable_auth">启用登录验证</label>
                </div>
            </div>
            <div class="form-group">
                <label for="invite_code">注册邀请码</label>
                <input type="text" id="invite_code" placeholder="设置邀请码">
            </div>
            <div class="form-group">
                <label for="admin_username">管理员账号</label>
                <input type="text" id="admin_username" placeholder="设置管理员账号">
            </div>
            <button class="save-btn" onclick="saveConfig()">保存配置</button>
            <div class="message" id="message"></div>
        </div>
    </div>

    <script>
        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const config = await res.json();
                document.getElementById('enable_auth').checked = config.enable_auth;
                document.getElementById('invite_code').value = config.invite_code || '';
                document.getElementById('admin_username').value = config.admin_username || '';
            } catch (e) {
                console.error(e);
            }
        }

        async function saveConfig() {
            const messageDiv = document.getElementById('message');
            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        enable_auth: document.getElementById('enable_auth').checked,
                        invite_code: document.getElementById('invite_code').value,
                        admin_username: document.getElementById('admin_username').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    messageDiv.textContent = '保存成功！';
                    messageDiv.className = 'message success';
                    messageDiv.style.display = 'block';
                    setTimeout(() => messageDiv.style.display = 'none', 2000);
                }
            } catch (e) {
                messageDiv.textContent = '保存失败！';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                setTimeout(() => messageDiv.style.display = 'none', 2000);
            }
        }

        loadConfig();
    </script>
</body>
</html>
